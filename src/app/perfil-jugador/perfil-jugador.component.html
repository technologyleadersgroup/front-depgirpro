<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="bg-white bg-cover bg-no-repeat bg-fixed flex h-full justify-center items-center m-0">
    <div class="flex flex-col max-w-[98%] max-h-[98%] text-center">
        <button class="absolute w-20 border-[none] top-4">
        <img src="../assets/escudosEquipos/flecha.png" alt="Botón Flecha apuntando a la izquierda"> 
        </button>
        <div class="w-full h-1/6">
            <img src="../assets/recursosimg/linda.png" alt="Foto de linda" class="rounded-3xl w-max h-[25rem] md:w-[50rem] md:h-[50rem]">
        </div>
        <div class="bg-green-300 w-full h-auto rounded-t-[60px] p-4 absolute top-80 md:top-[30rem] md:h-[45rem] md:rounded-t-[100px] md:p-[3rem] md:mx-[10px]">
            <div class="flex flex-row w-full m-4 text-center md:w-[45rem]">
                <div class="text-[2.4rem] font-bold mx-4 top-[-1] w-2/3 md:text-[4.3rem] md:w-[35rem]"> LINDA CAICEDO </div>
                <div class="flex flex-col w-1/3 items-center md:w-[10rem]">
                    <div class="escudo">
                        <img src="../assets/escudosEquipos/millonarios.png" alt="ESCUDO" class="w-8 h-10">
                    </div>
                    <div class="text-[3rem] font-bold md:text-[4]"> 10 </div>
                </div>
            </div>
            <div class="flex flex-col font-semibold">
                <div class="flex flex-row relative left-[-1rem] w-[25rem] h-[2.7rem] justify-center md:place-content-center md:w-[43rem] md:mx-[1rem] md:left-1">
                    <div class="border border-solid border-gray-200 w-1/3 bg-gray-100 place-content-center">EDAD: 19</div>
                    <div class="border border-solid border-gray-200 w-1/3 bg-gray-100 place-content-center">ALTURA: 170 CM</div>
                    <div class="border border-solid border-gray-200 w-1/3 bg-gray-100 place-content-center">PESO: 68 KG</div>
                </div>
                <div class="relative left-[-1rem] w-[25rem] h-[2.7rem]">
                    <div class="border border-solid border-gray-200 h-[2.7rem] place-content-center">POSICION: DELANTERA</div>
                </div>
                <div class="flex flex-row relative left-[-1rem] w-[25rem] h-[2.7rem]">
                    <div class="border border-solid border-gray-200 w-1/2 bg-gray-100 place-content-center">JUEGOS: 25</div>
                    <div class="border border-solid border-gray-200 w-1/2 bg-gray-100 place-content-center">VICTORIAS: 18</div>
                </div>
                <div class="flex flex-row relative left-[-1rem] w-[25rem] h-[2.7rem]">
                    <div class="border border-solid border-gray-200 w-1/2 bg-none place-content-center">GOLES: 14</div>
                    <div class="border border-solid border-gray-200 w-1/2 bg-none place-content-center">ATAJADAS: 0</div>
                </div>
                <div class=" relative left-[-1rem] w-[25rem] h-[2.7rem]">
                    <div class="border border-solid border-gray-200  bg-gray-100 place-content-center h-[2.7rem]">ASISTENCIAS: 29</div>
                </div>
            </div>
            <button class="m-4 text-[1.1rem] p-1 bg-blue-900 hover:bg-blue-400 rounded text-white h-[2.5rem] font-normal"> CONTACTAR </button>
        </div>
    </div>
    
</body>
</html>
<!-- ALWAYS NEED TO RUN THE FOLLOWING COMMAND: 
    npm run perfil
    dev is the name assigned in the file 'package.json'
 -->
